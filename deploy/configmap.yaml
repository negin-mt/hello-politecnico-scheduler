apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-politecnico-scheduler-config
  namespace: kube-system
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
      - schedulerName: hello-politecnico-scheduler
        plugins:
          filter:
            enabled:
              - name: HelloPolitecnico
